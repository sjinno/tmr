[package]
name = "tmr"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"
crossterm = "0.29"
directories = "6.0.0"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.3"
time = { version = "0.3", features = ["local-offset"] }
